# Volksmond macOS release build (WP-F of the mac port; see docs/mac-port-plan.md section 2.7).
#
# What this does: on a manual dispatch it builds the signed, notarised, stapled macOS DMG on a
# GitHub-hosted Apple Silicon runner and uploads it plus a notarisation.json sidecar as workflow
# artifacts. It does NOT publish. Publishing stays on Sean's Windows box:
#   .\release.ps1 -MacDmg <downloaded .dmg> -NotarisationJson <downloaded notarisation.json>
# (release.ps1 hashes the DMG, Defender-scans it, merges the mac keys into the live manifests and
# uploads to R2). CI produces artifacts; the human release lane publishes them.
#
# INERT UNTIL APPLE ENROLMENT. Apple Developer enrolment is deferred (mac-port-plan.md, "Decisions
# taken 2026-07-14" #1), so the signing secrets below do not exist yet. With them absent this
# workflow does NOT half-run: it fails fast at the preflight step with a clear message. There is one
# opt-in escape hatch (allow_unsigned_build) that runs the BUILD only, to prove the port compiles in
# CI before enrolment; its output is loudly labelled UNSIGNED and can never be fed to release.ps1
# (no sidecar is produced), so it can never be mistaken for a shippable DMG.
#
# SECRETS (repository or environment secrets; set them when Apple enrolment completes). The plan
# does not pin exact secret names (WP-F, section 5 #1 defers enrolment), so these are the WP-F
# conventions, matching the task brief's secrets.APPLE_CERT_P12 example:
#   APPLE_CERT_P12        base64 of the Developer ID Application cert+key exported as .p12
#   APPLE_CERT_PASSWORD   password protecting that .p12
#   APPLE_SIGNING_IDENTITY  the identity string, e.g. "Developer ID Application: DigiPhyte (Pty) Ltd (TEAMID)"
#   APPLE_ASC_KEY_ID      App Store Connect API key id (for notarytool)
#   APPLE_ASC_ISSUER_ID   App Store Connect issuer id
#   APPLE_ASC_API_KEY_P8  base64 of the App Store Connect .p8 private key
# Secrets are referenced by name only, never echoed. Anything derived from them (the .p12, the .p8,
# the keychain) is written to a temp path and removed in an always() cleanup step.
#
# TRIGGER: workflow_dispatch only. There is deliberately NO push/tag trigger: a push must never burn
# paid-tier macOS minutes or attempt a signing run (plan WP-F: "Manual workflow_dispatch, never on push").

name: mac-release

on:
  workflow_dispatch:
    inputs:
      allow_unsigned_build:
        description: "Run the BUILD only with no signing secrets, to prove the port compiles in CI before Apple enrolment. Output is labelled UNSIGNED and is NOT a shippable DMG (no notarisation sidecar)."
        type: boolean
        default: false

# Least privilege: this workflow reads the repo and writes nothing back (no releases, no pushes).
permissions:
  contents: read

jobs:
  build:
    # macos-15 is GitHub's Apple Silicon (arm64) image, matching the arm64-only target (macos-14 is
    # being retired by GitHub ~2 Nov 2026, hence the bump). The app's LSMinimumSystemVersion 14.4
    # floor is set by the spec's Info.plist (WP-E), independent of the runner OS. If GitHub retires
    # macos-15 in turn, bump to the next arm64 image.
    # TODO(ci-verify): confirm the default Xcode/Swift toolchain on this image exposes the Core Audio
    # process-tap SDK symbols (AudioHardwareCreateProcessTap, 14.2+) the WP-B helper needs.
    runs-on: macos-15
    timeout-minutes: 90

    # Secrets are legal in job-level env expressions (they are not in workflow-level env). SIGNING_READY
    # is the single gate: a real release needs ALL six secrets. Empty-string comparisons keep the values
    # opaque (no secret is ever printed).
    env:
      SIGNING_READY: ${{ (secrets.APPLE_CERT_P12 != '' && secrets.APPLE_CERT_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ASC_KEY_ID != '' && secrets.APPLE_ASC_ISSUER_ID != '' && secrets.APPLE_ASC_API_KEY_P8 != '') }}
      LLAMA_CPP_VERSION: "0.3.22"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # R7 (public-repo runner assumption). GitHub-hosted macOS minutes are free only while the repo is
      # public; a private repo bills them at the macOS multiplier. Do not silently assume public forever:
      # warn loudly and point at the self-hosted fallback. Not a hard failure (a private repo can still
      # run, it just costs), but it must be visible in the run.
      - name: Runner-cost check (repo visibility, plan R7)
        run: |
          set -euo pipefail
          # TODO(ci-verify): confirm github.event.repository.private is populated for workflow_dispatch on
          # the hosted runner; if ever empty, switch to a gh/api visibility query.
          PRIVATE='${{ github.event.repository.private }}'
          if [ "$PRIVATE" = "true" ]; then
            echo "::warning title=Private repo::This repo is PRIVATE. GitHub-hosted macOS minutes are billed at the macOS multiplier while private. Plan R7: if the repo stays private, move mac CI to a self-hosted runner on the physical Mac."
          else
            echo "Repo is public: GitHub-hosted macOS minutes are free (plan R7 assumption holds)."
          fi

      # Decide the mode and fail fast when nothing can be built. This is the "inert until enrolment" gate.
      - name: Preflight (mode + secret gate)
        id: preflight
        run: |
          set -euo pipefail
          if [ "${SIGNING_READY}" = "true" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "Signing secrets present: full release build (sign + notarise + staple)."
          elif [ "${{ inputs.allow_unsigned_build }}" = "true" ]; then
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning title=UNSIGNED build::Apple signing secrets are absent and allow_unsigned_build was set. Building the app to prove it compiles ONLY. The output is UNSIGNED, is NOT notarised, has NO notarisation sidecar, and cannot be published with release.ps1."
          else
            echo "::error title=Signing secrets absent::Apple signing secrets are not configured, so this workflow cannot build a releasable macOS DMG. Apple Developer enrolment is deferred (docs/mac-port-plan.md, 'Decisions taken 2026-07-14' #1). Set the secrets APPLE_CERT_P12, APPLE_CERT_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ASC_KEY_ID, APPLE_ASC_ISSUER_ID and APPLE_ASC_API_KEY_P8, then re-run. To only test that the port compiles before enrolment, re-run with the allow_unsigned_build input ticked."
            exit 1
          fi

      # Version is the single source of truth: read APP_VERSION from licensing.py with the SAME regex
      # release.ps1 uses (release.ps1:287-289). No workflow input override: an override would let the
      # sidecar version drift from licensing.py, and release.ps1 hard-fails on that mismatch (release.ps1:338).
      - name: Read APP_VERSION
        id: version
        run: |
          set -euo pipefail
          VER="$(grep -E 'APP_VERSION[[:space:]]*=' live_transcribe/licensing.py | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')"
          if ! printf '%s' "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error title=Version::Could not read APP_VERSION from live_transcribe/licensing.py."
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION = $VER"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The Swift audiotap helper (WP-B). Built explicitly here so a swift failure shows up as its own
      # step (matters for the R5 iteration loop). build-app-mac.sh may build it again when it bundles the
      # binary; a release rebuild is idempotent, so the double build is harmless.
      - name: Build the Swift audiotap helper (release)
        run: |
          set -euo pipefail
          if [ ! -d mac/volksmond-audiotap ]; then
            echo "::error title=Missing helper::mac/volksmond-audiotap is not present on this branch. It is authored in WP-B; this workflow cannot run until WP-B and WP-E have merged."
            exit 1
          fi
          # TODO(ci-verify): confirm swift build -c release succeeds on the runner SDK and emits
          # .build/release/volksmond-audiotap (the binary WP-E's spec bundles into Resources/bin/).
          swift build -c release --package-path mac/volksmond-audiotap
          ls -la mac/volksmond-audiotap/.build/release/ || true

      # Cache the locally-built llama-cpp-python 0.3.22 Metal wheel (plan R4: no mac wheel exists, so pip
      # source-builds it with GGML_METAL=on; that build is slow). pip caches wheels it builds under its
      # cache dir, so restoring the cache skips the rebuild on later runs. Keyed on the pinned llama version
      # plus runner OS and arch so a version bump or image change invalidates it cleanly.
      - name: Cache pip wheels (llama-cpp-python Metal build, plan R4)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-llama-${{ env.LLAMA_CPP_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-llama-${{ env.LLAMA_CPP_VERSION }}-${{ runner.os }}-${{ runner.arch }}-

      # Import the Developer ID cert into an ephemeral keychain so codesign (invoked inside-out by
      # PyInstaller's BUNDLE step via the spec's codesign_identity) can find it. Release mode only.
      # The keychain password is generated per run; no secret is needed for it and none is printed.
      - name: Import signing certificate (release only)
        if: steps.preflight.outputs.mode == 'release'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/volksmond-signing.keychain-db"
          KP="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          # Decode the cert from the base64 secret (openssl base64 -d is portable across the runner's
          # BSD base64 quirks; -A accepts single-line input). Value is never echoed; file removed in cleanup.
          printf '%s' "$APPLE_CERT_P12" | openssl base64 -d -A > "$CERT_PATH"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Allow codesign to use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KEYCHAIN" >/dev/null
          # Put the temp keychain on the search list ahead of login so codesign resolves the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"
          echo "VOLKSMOND_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          # TODO(ci-verify): confirm the imported identity is visible to codesign:
          #   security find-identity -v -p codesigning "$KEYCHAIN"  should list APPLE_SIGNING_IDENTITY.
          echo "Signing certificate imported into an ephemeral keychain."

      # MLX wheel smoke (plan WP-M6): fail fast on any mlx wheel or requirements-marker mistake
      # minutes before the slow PyInstaller build. A throwaway venv installs the exact mlx-whisper
      # pin from requirements.txt (its marker is darwin-arm64 only, which this runner is) and
      # imports the Metal runtime. Runs in BOTH modes; shares the pip cache above.
      - name: MLX wheel smoke (pre-build, fail fast)
        run: |
          set -euo pipefail
          PIN="$(grep -Eo '^mlx-whisper==[0-9][0-9.]*' requirements.txt || true)"
          if [ -z "$PIN" ]; then
            echo "::error title=MLX smoke::No mlx-whisper pin found in requirements.txt."
            exit 1
          fi
          python -m venv "$RUNNER_TEMP/mlx-smoke"
          "$RUNNER_TEMP/mlx-smoke/bin/pip" install --quiet "$PIN"
          "$RUNNER_TEMP/mlx-smoke/bin/python" -c "import mlx_whisper, mlx.core; print('MLX smoke OK: mlx_whisper and mlx.core import cleanly ($PIN)')"

      # The build driver (WP-E's mac/build-app-mac.sh): venv + pip install (requirements.txt, which WP-C
      # makes mac-safe via platform markers) + PyInstaller against volksmond-mac.spec + dmgbuild. It is the
      # local-Mac mirror of CI, so CI just calls it with the right environment.
      #
      # CONTRACT with build-app-mac.sh / volksmond-mac.spec (WP-E), all marked ci-verify because WP-E is a
      # parallel work package not yet on this branch:
      #   - CODESIGN_IDENTITY: build-app-mac.sh and volksmond-mac.spec both read this for the inside-out
      #     codesign_identity (mirrors how the Windows spec reads VOLKSMOND_OFFLINE). Empty => ad-hoc /
      #     unsigned build. The env key here MUST match the name those two consumers read.
      #   - CMAKE_ARGS / FORCE_CMAKE: make pip build llama-cpp-python with Metal (plan 2.6, R4). build-app-mac.sh
      #     must not override these.
      #   - Output: the driver must produce exactly one .dmg. We discover it below rather than hard-code a path.
      - name: Build the app and DMG (build-app-mac.sh)
        env:
          CODESIGN_IDENTITY: ${{ steps.preflight.outputs.mode == 'release' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          CMAKE_ARGS: "-DGGML_METAL=on"
          FORCE_CMAKE: "1"
        run: |
          set -euo pipefail
          if [ ! -f mac/build-app-mac.sh ]; then
            echo "::error title=Missing build driver::mac/build-app-mac.sh is not present on this branch. It is authored in WP-E; this workflow cannot run until WP-E has merged."
            exit 1
          fi
          # TODO(ci-verify): confirm build-app-mac.sh honours CODESIGN_IDENTITY, CMAKE_ARGS and
          # FORCE_CMAKE, and that the spec enables the hardened runtime (codesign --options runtime) and a
          # secure timestamp, both of which notarisation requires (plan R5).
          bash mac/build-app-mac.sh
          echo "Build driver finished."

      # Post-build bundle verification (codex review finding L2): assert dist/Volksmond.app is
      # well-formed right after the build, before we go hunting for a DMG to rename. The structural
      # checks (helper present + executable, app binary present, .app/Info.plist shape, MLX runtime
      # packaging per plan WP-M6) hold in BOTH modes. The codesign/entitlement checks only make sense
      # once a real Developer ID signature exists (an ad-hoc/unsigned build fails --verify by design),
      # so those are gated to release mode.
      - name: Verify built bundle (post-build asserts)
        run: |
          set -euo pipefail
          MODE="${{ steps.preflight.outputs.mode }}"
          APP="dist/Volksmond.app"
          HELPER="$APP/Contents/Resources/bin/volksmond-audiotap"
          EXE="$APP/Contents/MacOS/Volksmond"
          PLIST="$APP/Contents/Info.plist"

          echo "==> Asserting bundle structure (mode: $MODE)"
          [ -d "$APP" ] || { echo "::error title=Bundle check::Missing $APP"; exit 1; }
          [ -f "$PLIST" ] || { echo "::error title=Bundle check::Missing $PLIST"; exit 1; }
          [ -x "$EXE" ] || { echo "::error title=Bundle check::Missing or non-executable app binary: $EXE"; exit 1; }
          [ -x "$HELPER" ] || { echo "::error title=Bundle check::Missing or non-executable helper: $HELPER"; exit 1; }

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          if [ "$BUNDLE_ID" != "com.digiphyte.volksmond" ]; then
            echo "::error title=Bundle check::CFBundleIdentifier is '$BUNDLE_ID', expected com.digiphyte.volksmond"
            exit 1
          fi
          MIN_OS="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$PLIST")"
          if [ -z "$MIN_OS" ]; then
            echo "::error title=Bundle check::LSMinimumSystemVersion missing from $PLIST"
            exit 1
          fi
          echo "    Info.plist OK (bundle id $BUNDLE_ID, LSMinimumSystemVersion $MIN_OS)"
          echo "    app binary OK: $EXE"
          echo "    helper OK: $HELPER"

          # MLX runtime packaging (plan WP-M6). MLX fails to initialise without its Metal shader
          # library, and collect_all missing it is the known packaging gotcha, so assert it
          # structurally in both modes.
          echo "==> Asserting MLX runtime packaging (plan WP-M6)"
          METALLIBS="$(find "$APP" -name '*.metallib' -type f | wc -l | tr -d ' ')"
          if [ "$METALLIBS" -eq 0 ]; then
            echo "::error title=Bundle check::No *.metallib found under $APP. MLX cannot initialise without its Metal shader library; add an explicit datas entry for mlx/lib/*.metallib in volksmond-mac.spec."
            exit 1
          fi
          for PKG in mlx mlx_whisper; do
            if [ -z "$(find "$APP" -type d -name "$PKG" -print -quit)" ]; then
              echo "::error title=Bundle check::Package directory '$PKG' not found inside $APP (collect_all in volksmond-mac.spec did not capture it)."
              exit 1
            fi
          done
          TIKTOKENS="$(find "$APP" -path '*mlx_whisper*' -name '*.tiktoken' -type f | wc -l | tr -d ' ')"
          if [ "$TIKTOKENS" -eq 0 ]; then
            echo "::error title=Bundle check::mlx_whisper tokenizer assets (*.tiktoken) missing from $APP."
            exit 1
          fi
          echo "    MLX runtime OK ($METALLIBS metallib file(s); mlx + mlx_whisper dirs and tokenizer assets present)"

          # Frozen import smoke (codex L2): the structural asserts above only prove files
          # exist. This runs the built app binary itself with VOLKSMOND_SMOKE=mlx, which
          # imports mlx.core + mlx_whisper inside the frozen interpreter (torch is excluded
          # from the bundle, so this also proves mlx_whisper imports without it) and exits
          # 1 on darwin-arm64 if the import fails. Asserting the OK line guards against an
          # older entry point that would ignore the env var and exit 0 some other way.
          echo "==> Frozen MLX import smoke (VOLKSMOND_SMOKE=mlx)"
          set +e
          SMOKE_OUT="$(VOLKSMOND_SMOKE=mlx "$EXE" 2>&1)"
          SMOKE_RC=$?
          set -e
          printf '%s\n' "$SMOKE_OUT"
          if [ "$SMOKE_RC" -ne 0 ]; then
            echo "::error title=Bundle check::Frozen MLX smoke exited $SMOKE_RC. The bundle cannot import mlx.core/mlx_whisper (see output above)."
            exit 1
          fi
          if ! printf '%s' "$SMOKE_OUT" | grep -q "MLX SMOKE OK"; then
            echo "::error title=Bundle check::Frozen MLX smoke did not print 'MLX SMOKE OK' (entry point ignored VOLKSMOND_SMOKE?)."
            exit 1
          fi
          echo "    frozen MLX import smoke OK"

          if [ "$MODE" = "release" ]; then
            echo "==> Asserting Developer ID signature + entitlements (release mode)"
            codesign --verify --strict "$HELPER" || {
              echo "::error title=Bundle check::codesign --verify --strict failed for helper $HELPER"
              exit 1
            }
            codesign --verify --deep --strict "$APP" || {
              echo "::error title=Bundle check::codesign --verify --deep --strict failed for $APP"
              exit 1
            }
            # These entitlements are load-bearing for MLX too (plan WP-M6): Metal JIT compilation
            # needs allow-unsigned-executable-memory and disable-library-validation. Do not drop
            # them when revisiting the entitlement set.
            ENTS="$(codesign -d --entitlements :- "$EXE" 2>/dev/null)"
            for KEY in com.apple.security.device.audio-input \
                       com.apple.security.cs.allow-unsigned-executable-memory \
                       com.apple.security.cs.disable-library-validation; do
              printf '%s' "$ENTS" | grep -q "$KEY" || {
                echo "::error title=Bundle check::Entitlement $KEY missing from $EXE"
                exit 1
              }
            done
            echo "    codesign --verify OK (helper + app); entitlements present."
          else
            echo "==> Skipping codesign/entitlement asserts ($MODE build is ad-hoc/unsigned by design)."
          fi

          echo "==> Bundle verification passed ($MODE)."

      # Locate the DMG the driver produced and give it the canonical, versioned name release.ps1 records in
      # trust.json (filename = "Volksmond-<ver>.dmg", release.ps1:395). Renaming here means the artifact
      # matches that field regardless of what WP-E's dmgbuild names it. Unsigned builds get a loud suffix.
      - name: Locate and name the DMG
        id: dmg
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          MODE="${{ steps.preflight.outputs.mode }}"
          # TODO(ci-verify): confirm build-app-mac.sh writes the DMG under dist/. This searches the whole
          # workspace (which covers dist/) so a different output dir still works; it fails loudly if zero
          # or many DMGs appear. No mapfile/arrays: the runner's default /bin/bash is 3.2.
          DMGS="$(find . -maxdepth 4 -name '*.dmg' -type f 2>/dev/null)"
          COUNT="$(printf '%s\n' "$DMGS" | grep -c . || true)"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error title=No DMG::build-app-mac.sh produced no .dmg. Check the build log above."
            exit 1
          fi
          if [ "$COUNT" -gt 1 ]; then
            printf '%s\n' "$DMGS"
            echo "::error title=Ambiguous DMG::More than one .dmg found; expected exactly one. Listed above."
            exit 1
          fi
          SRC="$(printf '%s\n' "$DMGS" | head -1)"
          OUTDIR="$RUNNER_TEMP/artifacts"
          mkdir -p "$OUTDIR"
          if [ "$MODE" = "release" ]; then
            DEST="$OUTDIR/Volksmond-$VER.dmg"
          else
            DEST="$OUTDIR/Volksmond-$VER-UNSIGNED.dmg"
          fi
          mv "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "outdir=$OUTDIR" >> "$GITHUB_OUTPUT"
          echo "DMG: $DEST"

      # Notarise the DMG and staple the ticket (release only). notarytool --wait blocks until Apple returns
      # a verdict; --timeout bounds it. On anything other than Accepted, pull the per-file notarytool log
      # (R5: it names the exact reasons, e.g. a dylib missing the hardened runtime) and fail.
      - name: Notarise and staple (release only)
        if: steps.preflight.outputs.mode == 'release'
        env:
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          DMG="${{ steps.dmg.outputs.path }}"
          P8="$RUNNER_TEMP/asc_key.p8"
          printf '%s' "$APPLE_ASC_API_KEY_P8" | openssl base64 -d -A > "$P8"
          chmod 600 "$P8"
          NOTARY_OUT="$RUNNER_TEMP/notary-submit.json"
          # TODO(ci-verify): a first real submission is where entitlement/hardened-runtime problems surface
          # (plan R5); budget several cycles and read the log this step prints on failure.
          set +e
          xcrun notarytool submit "$DMG" \
            --key "$P8" --key-id "$APPLE_ASC_KEY_ID" --issuer "$APPLE_ASC_ISSUER_ID" \
            --output-format json --wait --timeout 30m > "$NOTARY_OUT"
          RC=$?
          set -e
          cat "$NOTARY_OUT" || true
          SUBID="$(jq -r '.id // empty' "$NOTARY_OUT")"
          STATUS="$(jq -r '.status // empty' "$NOTARY_OUT")"
          if [ "$RC" -ne 0 ] || [ "$STATUS" != "Accepted" ]; then
            echo "::error title=Notarisation failed::notarytool returned rc=$RC status='$STATUS'. Pulling the detailed log."
            if [ -n "$SUBID" ]; then
              xcrun notarytool log "$SUBID" \
                --key "$P8" --key-id "$APPLE_ASC_KEY_ID" --issuer "$APPLE_ASC_ISSUER_ID" \
                "$RUNNER_TEMP/notary-log.json" || true
              cat "$RUNNER_TEMP/notary-log.json" || true
            fi
            rm -f "$P8"
            exit 1
          fi
          # Accepted, but guard against an empty submission id: notarytool reported success yet gave no
          # .id. A sidecar with an empty submission_id passes release.ps1's non-empty check but is a
          # useless audit record, so fail loudly here BEFORE stapling or writing any output.
          if [ -z "$SUBID" ]; then
            echo "::error title=Empty submission id::notarytool returned status Accepted but no submission id (.id). Refusing to staple or emit a sidecar with an empty submission_id."
            rm -f "$P8"
            exit 1
          fi
          rm -f "$P8"
          # Staple the ticket so the DMG verifies offline (Gatekeeper-clean without a network round trip).
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "notary_submission_id=$SUBID" >> "$GITHUB_OUTPUT"
          echo "notary_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Notarised ($STATUS) and stapled: $SUBID"
        id: notarise

      # Gatekeeper self-check (release only): the same assessment a user's Mac makes on first open.
      - name: Verify Gatekeeper acceptance (release only)
        if: steps.preflight.outputs.mode == 'release'
        run: |
          set -euo pipefail
          DMG="${{ steps.dmg.outputs.path }}"
          # TODO(ci-verify): spctl on the DMG asserts the stapled app inside is notarised and accepted.
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG" || {
            echo "::error title=Gatekeeper::spctl did not accept the DMG. Do not ship it."
            exit 1
          }
          echo "Gatekeeper accepted the DMG."

      # SHA-256 of the exact bytes to be published, UPPERCASE hex to match release.ps1's Get-FileHash output
      # (release.ps1:311); the mac lane compares the sidecar sha256 against this (release.ps1:341).
      - name: Compute DMG SHA-256
        id: sha
        run: |
          set -euo pipefail
          DMG="${{ steps.dmg.outputs.path }}"
          SHA="$(shasum -a 256 "$DMG" | awk '{print toupper($1)}')"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $SHA"

      # Emit the notarisation.json sidecar EXACTLY matching release.ps1's -NotarisationJson validator, which
      # requires all of {submission_id, status, date, version, sha256} to be present and non-empty
      # (release.ps1:331-332). release.ps1 then checks version == APP_VERSION (release.ps1:338), sha256 ==
      # the DMG bytes (release.ps1:341) and status == "Accepted" (release.ps1:344). Release mode only: an
      # unsigned build deliberately gets NO sidecar, so it can never be published.
      - name: Write notarisation.json sidecar (release only)
        if: steps.preflight.outputs.mode == 'release'
        run: |
          set -euo pipefail
          OUTDIR="${{ steps.dmg.outputs.outdir }}"
          SIDECAR="$OUTDIR/notarisation.json"
          # date is free-form in release.ps1 (recorded verbatim into trust.json); use an ISO UTC date.
          DATE="$(date -u +%Y-%m-%d)"
          jq -n \
            --arg submission_id "${{ steps.notarise.outputs.notary_submission_id }}" \
            --arg status "${{ steps.notarise.outputs.notary_status }}" \
            --arg date "$DATE" \
            --arg version "${{ steps.version.outputs.version }}" \
            --arg sha256 "${{ steps.sha.outputs.sha256 }}" \
            '{submission_id:$submission_id, status:$status, date:$date, version:$version, sha256:$sha256}' \
            > "$SIDECAR"
          echo "Sidecar $SIDECAR:"
          cat "$SIDECAR"

      # Upload artifacts for the human release lane to download and feed to release.ps1 -MacDmg. Release
      # mode uploads DMG + sidecar together. Unsigned mode uploads only the labelled DMG and NO sidecar, so
      # release.ps1 has nothing to publish it with.
      - name: Upload release artifacts (DMG + sidecar)
        if: steps.preflight.outputs.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: volksmond-mac-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.dmg.outputs.outdir }}/Volksmond-${{ steps.version.outputs.version }}.dmg
            ${{ steps.dmg.outputs.outdir }}/notarisation.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload UNSIGNED build artifact (no sidecar)
        if: steps.preflight.outputs.mode == 'unsigned'
        uses: actions/upload-artifact@v4
        with:
          name: volksmond-mac-UNSIGNED-${{ steps.version.outputs.version }}
          path: ${{ steps.dmg.outputs.outdir }}/Volksmond-${{ steps.version.outputs.version }}-UNSIGNED.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Run summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Volksmond macOS build"
            echo ""
            echo "- Mode: \`${{ steps.preflight.outputs.mode }}\`"
            echo "- Version: \`${{ steps.version.outputs.version }}\`"
            if [ "${{ steps.preflight.outputs.mode }}" = "release" ]; then
              echo "- Notarisation: \`${{ steps.notarise.outputs.notary_status }}\` (\`${{ steps.notarise.outputs.notary_submission_id }}\`)"
              echo "- SHA-256: \`${{ steps.sha.outputs.sha256 }}\`"
              echo ""
              echo "Publish from the Windows box: \`.\\release.ps1 -MacDmg Volksmond-${{ steps.version.outputs.version }}.dmg -NotarisationJson notarisation.json\`"
            elif [ "${{ steps.preflight.outputs.mode }}" = "unsigned" ]; then
              echo ""
              echo "**UNSIGNED build.** Not notarised, no sidecar, NOT shippable. Compile proof only."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Always remove the ephemeral keychain and any decoded secret material, whatever the outcome.
      - name: Cleanup signing material
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/asc_key.p8" || true
          if [ -n "${VOLKSMOND_SIGNING_KEYCHAIN:-}" ] && [ -f "${VOLKSMOND_SIGNING_KEYCHAIN}" ]; then
            security delete-keychain "${VOLKSMOND_SIGNING_KEYCHAIN}" || true
            echo "Deleted ephemeral signing keychain."
          fi
